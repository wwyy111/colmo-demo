<svg xmlns="http://www.w3.org/2000/svg" width="964" height="706" viewBox="0 0 964 706">
  <title>无感唤醒交互1异常情况卡片</title>
  <desc>参考渐进唤醒草案高保真卡片样式，合并呈现关键缺项、家庭规则冲突与设备能力未知。</desc>
  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#FCFDFE"/></linearGradient>
    <linearGradient id="iconBg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F1F4F8"/><stop offset="1" stop-color="#E7ECF2"/></linearGradient>
    <linearGradient id="itemBg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F5F7FA"/><stop offset="1" stop-color="#F1F4F7"/></linearGradient>
    <filter id="softShadow" x="-5%" y="-5%" width="110%" height="116%"><feGaussianBlur in="SourceAlpha" stdDeviation="10" result="blur"/><feOffset dy="5" result="offset"/><feColorMatrix in="offset" type="matrix" values="0 0 0 0 0.10 0 0 0 0 0.16 0 0 0 0 0.24 0 0 0 .10 0"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <style>.cn{font-family:"Noto Sans CJK SC","Source Han Sans SC","Microsoft YaHei",sans-serif}.title{font-size:42px;font-weight:700;fill:#101D31}.status{font-size:27px;font-weight:400;fill:#1E2B3E}.section{font-size:30px;font-weight:700;fill:#101D31}.itemTitle{font-size:27px;font-weight:650;fill:#18263A}.itemSub{font-size:21px;font-weight:400;fill:#56657A}.link{font-size:28px;font-weight:500;fill:#0868E8}</style>
  </defs>
  <rect x="1" y="1" width="962" height="704" rx="34" fill="url(#cardBg)" stroke="#E8EBEF" filter="url(#softShadow)"/>
  <rect x="41" y="37" width="94" height="93" rx="21" fill="url(#iconBg)"/>
  <path d="M88 55V66M88 102V113M60 84H71M105 84H116M68 64L76 72M100 96L108 104M108 64L100 72M76 96L68 104" fill="none" stroke="#243348" stroke-width="4" stroke-linecap="round"/>
  <path d="M78 91L88 73L98 91Z" fill="none" stroke="#243348" stroke-width="3.5" stroke-linejoin="round"/><path d="M88 79V85" stroke="#243348" stroke-width="3.5" stroke-linecap="round"/><circle cx="88" cy="88.5" r="1.8" fill="#243348"/>
  <text class="cn title" x="165" y="101">方案生成异常</text>
  <rect x="730" y="51" width="151" height="66" rx="33" fill="#E9EDF2"/><text class="cn status" x="805.5" y="94" text-anchor="middle">待处理</text><path d="M911 72L924 84L911 97" fill="none" stroke="#2C3B51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <text class="cn section" x="42" y="177">检测到 3 项异常</text>
  <rect x="41" y="203" width="882" height="113" rx="22" fill="url(#itemBg)"/><circle cx="93" cy="259.5" r="27" fill="#E5EAF0"/><path d="M82 271H104M85 271V254C85 245 101 245 101 254V271M89 247V241H97V247" fill="none" stroke="#4C5B70" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text class="cn itemTitle" x="140" y="250">关键缺项</text><text class="cn itemSub" x="140" y="286">起床时间、适用成员或唤醒偏好尚未完善</text><path d="M885 250L895 259L885 268" fill="none" stroke="#58687C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="41" y="332" width="882" height="113" rx="22" fill="url(#itemBg)"/><circle cx="93" cy="388.5" r="27" fill="#E5EAF0"/><path d="M78 377H88L99 400H108M78 400H88L99 377H108" fill="none" stroke="#4C5B70" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/><text class="cn itemTitle" x="140" y="379">家庭规则冲突</text><text class="cn itemSub" x="140" y="415">个人设置与伴侣免扰、设备顺序或强度上限冲突</text><path d="M885 379L895 388L885 397" fill="none" stroke="#58687C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="41" y="461" width="882" height="113" rx="22" fill="url(#itemBg)"/><circle cx="93" cy="517.5" r="27" fill="#E5EAF0"/><rect x="80" y="501" width="22" height="32" rx="5" fill="none" stroke="#4C5B70" stroke-width="3.2"/><circle cx="91" cy="527" r="1.8" fill="#4C5B70"/><path d="M105 502C112 507 112 516 106 521M109 496C121 505 121 519 112 528" fill="none" stroke="#4C5B70" stroke-width="3" stroke-linecap="round"/><text class="cn itemTitle" x="140" y="508">设备能力未知</text><text class="cn itemSub" x="140" y="544">设备未绑定、离线，或能力与状态回执暂不可确认</text><path d="M885 508L895 517L885 526" fill="none" stroke="#58687C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="41" y1="600" x2="923" y2="600" stroke="#E5E9EE" stroke-width="2"/><text class="cn link" x="42" y="658">查看详情</text><path d="M196 637L210 650L196 663" fill="none" stroke="#0868E8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
